[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/analyzer", "crates/common", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
common = { path = "crates/common" }

anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossbeam-channel = "0.5"
diesel = { version = "2", default-features = false, features = ["sqlite", "r2d2", "chrono", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = { version = "2", features = ["sqlite"] }
dotenvy = "0.15"
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
md5 = "0.8"
memmap2 = "0.9"
ndarray = "0.17"
percent-encoding = "2"
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "ndarray", "tracing", "download-binaries", "tls-rustls", "copy-dylibs", "api-24"] }
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true
