name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: cpu
            suffix: ""
          - backend: cuda
            suffix: -cuda
          - backend: openvino
            suffix: -openvino
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/maestro
          flavor: |
            latest=auto
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          build-args: BACKEND=${{ matrix.backend }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.backend }}
          cache-to: type=gha,mode=max,scope=${{ matrix.backend }}

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: rustup toolchain install

      - name: Build
        run: cargo build --release --locked -p navidrome-plugin --target wasm32-wasip1

      - name: Bundle
        run: |
          mkdir bundle dist
          jq --arg version "${GITHUB_REF_NAME#v}" '.version = $version' \
            crates/navidrome-plugin/manifest.json > bundle/manifest.json
          cp target/wasm32-wasip1/release/navidrome_plugin.wasm bundle/plugin.wasm
          cd bundle && zip -r ../dist/maestro.ndp .

      - uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: dist/maestro.ndp

  release:
    needs: [image, plugin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: plugin
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=--prerelease; fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $prerelease \
            dist/maestro.ndp docker/docker-compose.yml
